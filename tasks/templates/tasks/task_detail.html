<!DOCTYPE html>
<html>
<head>
    <title>Task Details</title>

    <style>
        body{
            background:#121212;
            color:white;
            font-family:Arial;
            padding:40px;
        }

        .card{
            background:#1f1f1f;
            padding:30px;
            border-radius:10px;
            max-width:600px;
        }

        h1{
            color:#4CAF50;
        }

        .label{
            color:#bbb;
            margin-top:15px;
        }

        .value{
            font-size:18px;
        }

        .btn{
            margin-top:20px;
            padding:10px 15px;
            background:#4CAF50;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#45a049;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>Task Details</h1>

    <div class="label">Title</div>
    <div class="value">{{ task.task }}</div>

    <div class="label">Description</div>
    <div class="value">{{ task.description }}</div>

    <div class="label">Status</div>
    <div class="value">
        {% if task.completed %}
            Completed ✅
        {% else %}
            Pending ⏳
        {% endif %}
    </div>

    <div class="label">Created At</div>
    <div class="value">{{ task.created_at }}</div>

    <br>

    <a class="btn" href="{% url 'update' task.id %}">Edit</a>

    <a class="btn" href="{% url 'task_list' %}">Back</a>

</div>

</body>
</html>
