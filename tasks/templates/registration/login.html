<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            background:black;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:#222;
            padding:30px;
            border-radius:10px;
            width:300px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:green;
            color:white;
            border:none;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<!-- Django automatically sends the login form here -->
<form method="POST">

    {% csrf_token %}

    <!-- this renders username + password fields -->
    {{ form.as_p }}

    <button type="submit">Login</button>
    <p>Don't have an account?</p>
<a href="{% url 'signup' %}">Create one</a>

</form>

</div>

</body>
</html>
